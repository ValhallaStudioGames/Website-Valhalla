<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valhalla</title>
    <script type="module" src="./js/style.js"></script>
    <script type="module" src="./js/main.js" defer></script>
  </head>
  <header>
    <nav class="navbar navbar-expand-sm navbar-light bg-danger border-bottom border-white">
      <div class="container-fluid">
        <a class="navbar-brand text-white fw-bold" href="#">Valhalla Studios</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarID"
          aria-controls="navbarID" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarID">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active text-white fw-semibold" aria-current="page" href="#"><i class="bi bi-house-door-fill"></i> Home </a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-semibold" href="#"><i class="bi bi-controller"></i> Games </a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-semibold" href="about"><i class="bi bi-info-circle-fill"></i> About </a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-semibold" href="#"><i class="bi bi-bag-fill"></i> Products </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <body>
      <img src="https://www.bauwendr.com/media/index/val-banner.png" class="w-100">
      <div class="container mt-2 mb-5">
        <h2 class="display-6 fw-bold">Carousel</h2>
        <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="true">
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
          </div>
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="https://placehold.co/600x400" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
              <img src="https://placehold.co/600x400" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
              <img src="https://placehold.co/600x400" class="d-block w-100" alt="...">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>
  </body>
</html>
